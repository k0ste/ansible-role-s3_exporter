---
- name: "s3_exporter | Daemon reload"
  ansible.builtin.systemd:
    daemon_reload: "yes"
  listen: "Daemon reload"
- name: "s3_exporter | Restart s3_exporter"
  ansible.builtin.systemd:
    name: "{{ lookup('ansible.builtin.vars', 's3_exporter_service') }}"
    state: "restarted"
  listen: "Restart s3_exporter"
  when:
    - "lookup('ansible.builtin.vars', 's3_exporter', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 's3_exporter') |
       community.general.json_query(lookup('ansible.builtin.vars',
      's3_exporter_restart', default='')) == 'true'"
  vars:
    s3_exporter_restart: "[] | map(&restart || 'false', @) | [0]"
