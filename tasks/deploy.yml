---
- name: "s3_exporter | Deploy s3_exporter options configuration"
  ansible.builtin.template:
    src: "s3_exporter.options.j2"
    dest: "/etc/conf.d/s3_exporter"
    owner: "root"
    group: "root"
    mode: "0644"
  when:
    - "lookup('ansible.builtin.vars', 's3_exporter', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 's3_exporter') |
       community.general.json_query(lookup('ansible.builtin.vars',
      's3_exporter_install_package', default='')) == 'true'"
  vars:
    s3_exporter_install_package: "[] |
      map(&install_package || 'false', @) | [0]"
  notify:
    - "Restart s3_exporter"
- name: "s3_exporter | Deploy s3_exporter service configuration"
  ansible.builtin.template:
    src: "s3_exporter.service.j2"
    dest: "{{ '/etc/systemd/system/' + lookup('ansible.builtin.vars',
      's3_exporter_service') + '.service' }}"
    owner: "root"
    group: "root"
    mode: "0644"
  when:
    - "lookup('ansible.builtin.vars', 's3_exporter', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 's3_exporter') |
       community.general.json_query(lookup('ansible.builtin.vars',
      's3_exporter_install_package', default='')) == 'false'"
  vars:
    s3_exporter_install_package: "[] |
      map(&install_package || 'false', @) | [0]"
  notify:
    - "Daemon reload"
    - "Restart s3_exporter"
- name: "s3_exporter | Enable s3_exporter"
  ansible.builtin.systemd:
    name: "{{ lookup('ansible.builtin.vars', 's3_exporter_service') }}"
    enabled: "yes"
  when:
    - "lookup('ansible.builtin.vars', 's3_exporter', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 's3_exporter') |
       community.general.json_query(lookup('ansible.builtin.vars',
      's3_exporter_enable', default='')) == 'true'"
  vars:
    s3_exporter_enable: "[] | map(&enable || 'false', @) | [0]"
